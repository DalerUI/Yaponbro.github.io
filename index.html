<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>JAVASHOP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: blurred live-video stage; centred hero with NFT orbit, then scroll-driven chapters (about, services, horizontal NFT rail, perks, steps, FAQ, contact) */
:root{
  --bg:#060608; --panel:rgba(16,16,22,.62); --line:rgba(255,255,255,.09); --fg:#efeef4; --mute:#9a98a8;
  --gold:#f5c04a; --gold2:#ff9a3c; --tg:#2aabee; --red:#d23a4f; --vio:#8b5cf6;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

/* background */
.bgv{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bgv video{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;filter:blur(3px) brightness(.55);transform:scale(1.02)}
.bgv::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,transparent 0%,rgba(6,6,8,.55) 60%,rgba(6,6,8,.9) 100%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.prog{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);z-index:40;
  background:linear-gradient(90deg,var(--gold),var(--gold2),var(--red))}
.wrap{position:relative;z-index:2;max-width:1120px;margin:0 auto}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px}
nav::before{content:"";position:absolute;inset:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));background:linear-gradient(rgba(6,6,8,.85),transparent);z-index:-1}
.logo{font-family:var(--display);font-weight:800;letter-spacing:.06em;font-size:18px;text-decoration:none}
.logo span{color:var(--gold)}
.navr{display:flex;gap:8px;align-items:center}
.langs{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:4px;background:var(--panel);backdrop-filter:blur(10px)}
.langs button{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;padding:6px 11px;border-radius:999px;color:var(--mute);transition:.25s}
.langs button.on{background:var(--gold);color:#120d02}

/* music button */
.mus{all:unset;position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);font-size:13px;font-weight:700}
.mus .bars{display:flex;gap:3px;align-items:flex-end;height:18px;width:22px}
.mus .bars i{width:4px;background:var(--gold);border-radius:2px;height:5px;transition:height .3s}
.mus.on .bars i{animation:eq 1s ease-in-out infinite}
.mus.on .bars i:nth-child(2){animation-delay:.2s}.mus.on .bars i:nth-child(3){animation-delay:.4s}.mus.on .bars i:nth-child(4){animation-delay:.6s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
.mus:not(.on){animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(245,192,74,.0)}50%{box-shadow:0 0 0 8px rgba(245,192,74,.18)}}

/* hero */
.hero{display:grid;justify-items:center;text-align:center;gap:22px;padding-block:70px 90px}
.stage{position:relative;width:min(250px,56vw);aspect-ratio:1;margin-block:60px 30px}
.ring{position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(var(--gold),var(--gold2),var(--red),transparent 50%,var(--tg),var(--gold));animation:spin 5s linear infinite}
.ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.ava{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:0 0 90px -10px rgba(210,58,79,.55);transition:transform .2s ease-out}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.orbit{position:absolute;inset:0;animation:spin 22s linear infinite}
.orbit .o{position:absolute;left:50%;top:50%;width:0;height:0}
.orbit .o .n{position:absolute;width:86px;height:86px;margin:-43px 0 0 -43px;animation:spin 22s linear infinite reverse}
.orbit .o .n img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 10px 18px var(--gl)) drop-shadow(0 0 2px rgba(0,0,0,.6));animation:bob 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-4px) scale(1.06)}}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:999px;color:#cfcdd9;backdrop-filter:blur(8px)}
.dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.6)}70%,100%{box-shadow:0 0 0 10px rgba(61,220,132,0)}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,8.5vw,92px);line-height:.98;margin:0;letter-spacing:-.02em}
h1 .ln{display:block;overflow:hidden;padding-bottom:.06em}
h1 .ln>span{display:inline-block;animation:up 1.1s cubic-bezier(.2,.8,.2,1) both}
h1 .gold{background:linear-gradient(90deg,var(--gold),var(--gold2),#fff3c4,var(--gold));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:up 1.1s .12s cubic-bezier(.2,.8,.2,1) both,shine 5s linear infinite!important}
@keyframes up{from{transform:translateY(105%)}}
@keyframes shine{to{background-position:300% 0}}
.role{font-family:var(--mono);font-size:clamp(14px,2.4vw,17px);min-height:1.6em}
.role b{color:var(--gold);font-weight:500}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--gold);vertical-align:-3px;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lead{max-width:58ch;color:#bdbbc9;margin:0;font-size:17px}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;padding:15px 26px;border-radius:14px;transition:box-shadow .3s,border-color .3s;will-change:transform}
.btn svg{width:18px;height:18px}
.btn.p{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#140e02;box-shadow:0 10px 40px -10px rgba(245,192,74,.7)}
.btn.s{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px)}
.btn.s:hover{border-color:var(--tg)}
.scrollhint{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mute);display:grid;justify-items:center;gap:8px;margin-top:20px}
.scrollhint i{width:22px;height:36px;border:1.5px solid var(--mute);border-radius:12px;position:relative}
.scrollhint i::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--gold);animation:wheel 1.6s infinite}
@keyframes wheel{to{transform:translateY(12px);opacity:0}}

/* marquee */
.marq{overflow:hidden;padding-block:16px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));background:rgba(245,192,74,.95);color:#120d02;transform:rotate(-2deg);margin-block:20px}
.marq.b{background:rgba(16,16,22,.85);color:var(--fg);transform:rotate(1.5deg);margin-top:-46px;border-block:1px solid var(--line)}
.mtrack{display:flex;gap:36px;width:max-content;font-family:var(--display);font-weight:800;font-size:clamp(18px,3vw,30px);white-space:nowrap;will-change:transform}
.mtrack span{display:flex;align-items:center;gap:36px}

/* sections */
section{padding-block:110px 10px;position:relative}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 12px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--gold)}
h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,5.4vw,56px);line-height:1.05;margin:0 0 36px;text-wrap:balance;max-width:18ch}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.bigtext{font-family:var(--display);font-weight:600;font-size:clamp(22px,3.6vw,40px);line-height:1.3;margin:0 0 50px;max-width:28ch;text-wrap:pretty}
.bigtext .w{opacity:.18;transition:opacity .2s}
.bigtext .w.k{color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{border-radius:20px;padding:24px}
.stat .n{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,44px);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.stat .l{color:var(--mute);font-size:14px;margin-top:10px}

.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{position:relative;border-radius:24px;padding:30px 26px;overflow:hidden;min-width:0;transition:border-color .3s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),var(--c),transparent 55%);opacity:0;transition:opacity .3s}
.card:hover::before{opacity:1}
.card:hover{border-color:var(--cb)}
.card>*{position:relative}
.card .ic{width:70px;height:70px;margin-bottom:22px}
.card .ic svg{width:100%;height:100%;filter:drop-shadow(0 10px 20px var(--c))}
.card h3{font-family:var(--display);font-size:21px;margin:0 0 10px;font-weight:600}
.card p{color:var(--mute);margin:0 0 18px;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-family:var(--mono);font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:#cfcdd9}
.c1{--c:rgba(245,192,74,.28);--cb:var(--gold)}.c2{--c:rgba(210,58,79,.3);--cb:var(--red)}.c3{--c:rgba(42,171,238,.3);--cb:var(--tg)}

/* horizontal NFT rail */
.rail-sec{padding-block:110px 40px}
.rail-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.rail-head p{color:var(--mute);max-width:40ch;margin:0 0 36px}
.rail-outer{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:thin;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)))}
.rail{display:flex;gap:20px;width:max-content;padding-inline:max(16px,env(safe-area-inset-left,0px));will-change:transform}
.nft{scroll-snap-align:center;width:clamp(220px,26vw,290px);border-radius:26px;padding:22px;flex:none;position:relative;overflow:hidden}
.nft .art{aspect-ratio:1;border-radius:18px;background:#111;box-shadow:0 20px 40px -18px var(--a);margin-bottom:18px;position:relative;overflow:hidden}
.nft .art::after{z-index:1;content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);transform:translateX(-60%);transition:transform .9s}
.nft:hover .art::after{transform:translateX(60%)}
.nft .art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.nft:hover .art img{transform:scale(1.08) rotate(-2deg)}
.nft h4{font-family:var(--display);font-weight:600;font-size:17px;margin:0 0 6px}
.nft .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--mute)}
.nft .r{color:var(--rc)}
.note{font-size:13px;color:var(--mute);margin-top:18px}

.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.perk{border-radius:22px;padding:26px;min-width:0}
.perk .pi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(245,192,74,.12);color:var(--gold);margin-bottom:16px}
.perk .pi svg{width:24px;height:24px}
.perk h4{font-family:var(--display);font-weight:600;font-size:17px;margin:0 0 8px}
.perk p{margin:0;color:var(--mute);font-size:15px}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
.sline{position:absolute;left:0;right:0;top:28px;height:2px;background:var(--line)}
.sline i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transform-origin:0;transform:scaleX(0)}
.step{position:relative}
.step .num{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#120d02;
  background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 0 0 6px var(--bg),0 0 30px rgba(245,192,74,.4);margin-bottom:18px}
.step h4{font-family:var(--display);font-weight:600;font-size:17px;margin:0 0 6px}
.step p{margin:0;color:var(--mute);font-size:15px}

.faq{display:grid;gap:10px;max-width:820px}
.faq details{border-radius:18px;padding:0 22px;transition:border-color .3s}
.faq details[open]{border-color:rgba(245,192,74,.4)}
.faq summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--mono);color:var(--gold);font-size:22px;line-height:1;transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0 0 20px;color:var(--mute);max-width:65ch}

.contact{border-radius:32px;padding:clamp(26px,6vw,70px);position:relative;overflow:hidden;text-align:center;display:grid;justify-items:center}
.contact::before{content:"";position:absolute;width:600px;height:600px;left:50%;top:-300px;margin-left:-300px;border-radius:50%;background:radial-gradient(circle,rgba(245,192,74,.25),transparent 65%);pointer-events:none}
.contact h2{font-size:clamp(32px,7vw,76px);max-width:14ch;margin-bottom:16px}
.contact .lead{margin-bottom:34px}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;text-align:left}
.lk{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:1px solid var(--line);background:rgba(6,6,8,.6);text-decoration:none;transition:transform .25s,border-color .25s;min-width:0}
.lk:hover{transform:translateY(-5px);border-color:var(--h)}
.lk .ico{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--h)}
.lk .ico svg{width:22px;height:22px;color:#fff}
.lk small{display:block;color:var(--mute);font-size:12.5px}
.lk b{display:block;font-family:var(--mono);font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .t{min-width:0;flex:1}
.copy{all:unset;cursor:pointer;flex:none;font-family:var(--mono);font-size:11px;color:var(--mute);border:1px solid var(--line);padding:6px 9px;border-radius:8px}
.copy:hover{color:var(--fg)}
.lk.tg{--h:var(--tg)}.lk.ch{--h:#1c7fc0}.lk.ig{--h:#d62976}
.lk.ig .ico{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf)}
footer{padding-block:60px 90px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--mute);font-size:13px;font-family:var(--mono)}

.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160px);background:var(--gold);color:#140e02;font-weight:700;padding:10px 18px;border-radius:12px;z-index:50;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.toast.show{transform:translate(-50%,0)}

@media (max-width:900px){.svc,.perks,.links{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr 1fr;row-gap:36px}.sline{display:none}}
@media (max-width:460px){.steps{grid-template-columns:1fr}.langs button{padding:6px 8px}.orbit .o .n{width:62px;height:62px;margin:-31px 0 0 -31px}.mus span.lbl{display:none}}
@media (max-width:760px){.rail-outer{overflow-x:auto;scroll-snap-type:x mandatory}.nft{scroll-snap-align:center}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  ctx.add(()=>{
  // steps line
  gsap.to("#sline",{scaleX:1,ease:"none",scrollTrigger:{trigger:"#steps",start:"top 75%",end:"bottom 55%",scrub:true}});
  gsap.fromTo(".step .num",{scale:0},{scale:1,stagger:.2,ease:"back.out(2)",duration:.8,scrollTrigger:{trigger:"#steps",start:"top 75%"}});
  // contact zoom
  gsap.fromTo(".contact",{scale:.88},{scale:1,ease:"none",scrollTrigger:{trigger:".contact",start:"top bottom",end:"top 40%",scrub:true}});
  });
  ScrollTrigger.refresh();
}
function boot(){ready=true;try{initScroll()}catch(e){console.error(e)}}
if(document.readyState==="complete")boot();else addEventListener("load",boot);

/* copy */
const toast=$("#toast");
$$(".copy").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();
  const show=()=>{toast.textContent=T[L].copied+": "+b.dataset.c;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1800)};
  navigator.clipboard?.writeText(b.dataset.c).then(show).catch(()=>{const r=document.createRange();r.selectNodeContents(b.previousElementSibling.querySelector("b"));getSelection().removeAllRanges();getSelection().addRange(r)})}));
document.getElementById("bgvid").play?.().catch(()=>{});
